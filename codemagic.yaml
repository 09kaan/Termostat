# Codemagic CI Configuration
# Bu dosya PR ve commit bazlı otomatik birim test (RunnerTests) ve imzasız (unsigned)
# derleme doğrulamasını gerçekleştirir. TestFlight / Production dağıtımı için kullanılan
# imzalı (signed) Codemagic iş akışlarının yerine geçmez veya onları engellemez.

workflows:
  ios-pr-unsigned-verification:
    name: iOS CI Tests & Unsigned Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    working_directory: termostat_app
    scripts:
      - name: Flutter dependencies
        script: |
          set -euo pipefail
          flutter packages pub get
      - name: CocoaPods dependencies
        script: |
          set -euo pipefail
          cd ios
          pod install
          cd ..
      - name: Run Dart unit tests
        script: |
          set -euo pipefail
          flutter test test/thermostat_constants_test.dart
      - name: Run iOS Unit Tests (RunnerTests)
        script: |
          set -euo pipefail
          mkdir -p ios/build

          # Parse xcrun simctl list JSON to select only an available iPhone under an iOS runtime
          SIMULATOR_ID=$(python3 -c '
          import json, subprocess, sys
          try:
              raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
              data = json.loads(raw)
              devices_by_runtime = data.get("devices", {})
              selected = None
              for runtime, dev_list in devices_by_runtime.items():
                  if "iOS" in runtime or "com.apple.CoreSimulator.SimRuntime.iOS" in runtime:
                      for dev in dev_list:
                          if dev.get("isAvailable", False) and "iPhone" in dev.get("name", ""):
                              device_name = dev.get("name", "")
                              selected = dev.get("udid")
                              print(f"Found {device_name} ({selected}) on {runtime}", file=sys.stderr)
                              break
                  if selected:
                      break
              if not selected:
                  sys.exit("No available iPhone simulator on iOS runtime found.")
              print(selected)
          except Exception as e:
              sys.exit(f"Error parsing simulator list: {e}")
          ')

          echo "Selected iOS Simulator UDID: $SIMULATOR_ID"

          # Run xcodebuild test for Runner target / RunnerTests
          # Both stdout and stderr are piped through tee into xcodebuild_test.log
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath ios/build/RunnerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee ios/build/xcodebuild_test.log
      - name: Build unsigned iOS Release Bundle
        script: |
          set -euo pipefail
          mkdir -p ios/build

          # Unsigned release build for CI verification without exposing private signing certificates/keys
          # Both stdout and stderr are piped through tee into flutter_release_build.log
          flutter build ios --release --no-codesign 2>&1 | tee ios/build/flutter_release_build.log
    artifacts:
      - termostat_app/ios/build/RunnerTests.xcresult
      - termostat_app/ios/build/xcodebuild_test.log
      - termostat_app/ios/build/flutter_release_build.log
      - termostat_app/build/ios/iphoneos/*.app

  # Optional signed IPA workflow. Upload BOTH updated profiles and a certificate
  # to Codemagic Team settings first. This workflow does NOT publish automatically.
  ios-widget-signed-artifact:
    name: Termostat + Widget Signed IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: termostat_app
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.termostatApp
    scripts:
      - name: Dependencies
        script: |
          set -euo pipefail
          flutter pub get
          cd ios
          pod install
      - name: Apply both provisioning profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles
      - name: Build signed app and widget
        script: |
          set -euo pipefail
          mkdir -p ios/build
          flutter build ipa --release --export-options-plist "$HOME/export_options.plist" 2>&1 | tee ios/build/widget_signed_build.log
    artifacts:
      - termostat_app/build/ios/ipa/*.ipa
      - termostat_app/build/ios/archive/*.xcarchive
      - termostat_app/ios/build/widget_signed_build.log
