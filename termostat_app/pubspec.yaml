name: termostat_app
description: A smart thermostat control application.
publish_to: 'none'

version: 1.0.0+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  firebase_core: ^3.8.1
  firebase_database: ^11.3.2
  firebase_auth: ^5.5.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  intl: ^0.19.0
  fl_chart: ^0.65.0
  timezone: ^0.9.2
  flutter_svg: ^2.0.9
  flutter_animate: ^4.5.0
  weather: ^3.1.1
  table_calendar: ^3.0.9
  flutter_local_notifications: ^17.0.0
  app_links: ^6.0.0
  home_widget: ^0.7.0
  permission_handler: ^11.0.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
